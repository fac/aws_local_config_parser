name: Build and Release Gem
on:
  push:
    branches:
      - main
    paths:
      - lib/aws_local_config_parser/version.rb

jobs:
  release:
    name: Release to RubyGems.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
    # Build the gem package
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
      with:
        bundler-cache: true

    # Run tests and rubocop
    - name: Run tests and rubocop
      run: bundle exec rake

    # Release
    - name: Release to RubyGems.org
      uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1
